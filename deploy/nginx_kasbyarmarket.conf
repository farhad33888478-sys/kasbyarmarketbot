# تنظیمات Nginx برای kasbyarmarket.ir
# این فایل را روی سرور در مسیر زیر کپی کن:
#   /etc/nginx/sites-available/kasbyarmarket
# و با دستور زیر فعالش کن:
#   sudo ln -s /etc/nginx/sites-available/kasbyarmarket /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# قبل از استفاده، هر جا نوشته kasbyarmarket.ir را با دامنه‌ی واقعی خودت جایگزین کن.

server {
    listen 80;
    listen [::]:80;
    server_name kasbyarmarket.ir www.kasbyarmarket.ir;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/kasbyarmarketbot/web/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# نکته: بعد از اجرای certbot (مرحله گواهی SSL در راهنما)،
# این فایل خودکار به‌روزرسانی می‌شود تا HTTPS هم اضافه شود.
